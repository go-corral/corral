# Prose and source-comment linting. `make vale` installs the pinned packages and
# checks every authoritative file; pre-commit runs the same full scan before each commit.
# File-level exclusions are applied by the walk glob in scripts/lint-vale.sh, not here:
# Vale unions BasedOnStyles across matching sections, so a per-file override cannot subtract.
StylesPath = .vale/styles
MinAlertLevel = error
Vocab = Corral

Packages = Google, \
  https://github.com/JMill/deslop/releases/download/v0.2.3/Deslop.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.26.0/ai-tells.zip

[*.md]
BasedOnStyles = Google, Deslop, ai-tells

# Warning and suggestion rules stay informational at this alert level. Disable only
# error-level rules that conflict with security and CLI documentation.
Google.Quotes = NO
Google.Latin = NO
Google.LyHyphens = NO
Google.Spacing = NO

ai-tells.FormalRegister = NO
ai-tells.VerbTricolon = NO
ai-tells.ShipOveruse = NO
ai-tells.ColonUsage = NO
ai-tells.OverusedVocabulary = NO
ai-tells.SemicolonUsage = NO
ai-tells.FigurativeSits = NO
ai-tells.FigurativeRuns = NO
ai-tells.CataphoricForecasting = NO
ai-tells.AnthropomorphicJustification = NO
ai-tells.FormalTransitions = NO
ai-tells.AbsoluteAssertions = NO
ai-tells.ContrastiveFormulas = NO
ai-tells.ContrastiveNegation = NO
ai-tells.EmphaticCopula = NO
ai-tells.EmptyPadding = NO
ai-tells.FigurativeCarries = NO
ai-tells.Metacommentary = NO
ai-tells.MicDrop = NO
ai-tells.StackedAnaphora = NO

# deslop ships no errors by default. These mechanical openings, closers, and
# promotional verbs are reliable enough to gate.
Deslop.AssistantOpener = error
Deslop.AssistantCloser = error
Deslop.OpenerCliche = error
Deslop.HollowCloser = error
Deslop.MarketingVerb = error

[*.{go,ts}]
BasedOnStyles = CorralComments
